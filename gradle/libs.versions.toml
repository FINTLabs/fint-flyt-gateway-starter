[versions]
spring-boot = "4.2.0"
kotlin = "2.4.21"
# The Kotlin version in the Spring Boot BOM. Keep it in step with spring-boot.
kotlin-stdlib = "2.4.21"
flyt-kafka = "8.0.0-rc-7"
flyt-security-starter = "1.0.0-rc-3"
mockito-kotlin = "6.4.0"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
logback = "1.6.8"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
flyt-kafka = { module = "no.novari:flyt-kafka", version.ref = "flyt-kafka" }
flyt-security-starter = { module = "no.novari:flyt-security-starter", version.ref = "flyt-security-starter" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
